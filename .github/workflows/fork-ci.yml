name: Verify fork

on:
  pull_request:
    branches:
      - fork/main
  push:
    branches:
      - fork/main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Verify Android
        run: |
          set +e
          npm run verify:android > android.log 2>&1
          status=$?
          tail -n 120 android.log
          exit "$status"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run verify:ios

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify packed files
        run: |
          package="$(npm pack --silent)"
          tar -tf "$package" | grep -Fxq package/dist/esm/index.js
          tar -tf "$package" | grep -Fxq package/dist/esm/index.d.ts
          tar -tf "$package" | grep -Fxq package/android/src/main/AndroidManifest.xml
          tar -tf "$package" | grep -Fxq package/ios/Sources/PlaylistPlugin/Plugin.swift
          tar -tf "$package" | grep -Fxq package/Package.swift
